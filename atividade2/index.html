<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Retas e triângulos de Bresenham</title>

    <style>
        body {
            background: #ffffff;
            color: #222222;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 40px;
        }

        canvas {
            /* outline em vez de border: a borda entraria na conta do
               getBoundingClientRect e deslocaria o clique em 1 pixel */
            outline: 1px solid #cccccc;
            cursor: crosshair;
        }

        p {
            font-size: 14px;
            margin: 0;
        }
    </style>
</head>

<body>

    <canvas id="canvas" width="600" height="600"></canvas>

    <p>
        Digite R para traçar retas (2 cliques), T para traçar triângulos
        (3 cliques) e de 0 a 9 para alterar a cor.
    </p>

    <script src="main.js"></script>

</body>
</html>
